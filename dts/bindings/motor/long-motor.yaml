description: |
  Long EDC Motor driver — PWM + direction GPIO + QDEC feedback + PID speed loop.

  Motor shaft      →  [gearbox: gear-ratio]  →  Wheel
  Encoder on motor shaft                       QDEC measures motor-side RPM

  Example:

      motor0: motor0 {
          compatible = "long-motor";
          pwms = <&pwma0 0 PWM_MSEC(20) PWM_POLARITY_NORMAL>;
          dir-gpios = <&gpiob 0 GPIO_ACTIVE_HIGH>;
          qdec = <&qdec0>;
          gear-ratio = <30>;    // 30:1 减速比，电机 30 转 = 轮子 1 转
      };

compatible: "long-motor"

properties:
  pwms:
    required: true
    type: phandle-array
    description: PWM specifier for motor speed control.

  dir-gpios:
    required: true
    type: phandle-array
    description: Direction GPIO. HIGH = forward, LOW = reverse.

  qdec:
    required: true
    type: phandle
    description: Phandle to a long-qdec quadrature encoder device.

  gear-ratio:
    required: true
    type: int
    description: |
      Gearbox reduction ratio N:1.
      Motor shaft rotates N times per 1 wheel revolution.
      Used to convert motor-side QDEC readings to wheel-side RPM and distance.
